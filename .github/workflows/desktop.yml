# Desktop installers: .dmg for Apple Silicon and Intel, .msi/.exe for Windows.
#
# Free builds: runs on tags and on demand. Builds are unsigned — signing
# certificates are added later as GitHub secrets (APPLE_CERTIFICATE for the
# .dmg, none needed for a working NSIS installer).
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: duly-${{ matrix.platform }}-${{ matrix.args != '' && 'intel' || 'silicon' }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
