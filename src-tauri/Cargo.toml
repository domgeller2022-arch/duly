[package]
name = "duly"
version = "0.1.0"
description = "Duly — offline invoicing"
authors = ["Duly"]
edition = "2021"

[lib]
name = "duly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
# ponytail: keyring has no Android store; Android falls back to its in-memory
# mock, so SMTP passwords do not survive an app restart there. A real Android
# secret store (Keystore-backed) is the upgrade path.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
strip = true
lto = true
